<!DOCTYPE html>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: lightgray; overflow-y: auto; }
  canvas { display: block; }
  #controls {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.9);
    padding: 10px 20px;
    border-radius: 20px;
    font-family: monospace;
    font-size: 13px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  #play {
    cursor: pointer;
    border: none;
    background: #333;
    color: white;
    padding: 6px 0;
    width: 80px;
    border-radius: 12px;
    font-family: monospace;
    font-size: 13px;
    text-align: center;
  }
  #speed {
    width: 120px;
    cursor: pointer;
    accent-color: #333;
    height: 4px;
  }
</style>
<canvas id="test"></canvas>
<div id="controls">
  <button id="play">Play</button>
  <input id="speed" type="range" min="1" max="10001" value="5000">
</div>
<script type="module" src="./cpu.ts"></script>
