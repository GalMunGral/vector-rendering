<!DOCTYPE html>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; flex-direction: row; width: 100vw; height: 100vh; background: #f0f0f0; }
  .panel { flex: 1; display: flex; flex-direction: column; }
  .label { font-family: monospace; font-size: 13px; padding: 10px 16px; background: #f0f0f0; border-bottom: 1px solid #ccc; }
  iframe { flex: 1; border: none; border-right: 1px solid #ccc; }
  .panel:last-child iframe { border-right: none; }
</style>
<body>
  <div class="panel">
    <div class="label">CPU rasterization &mdash; no hit testing</div>
    <iframe src="cpu.html"></iframe>
  </div>
  <div class="panel">
    <div class="label">CPU rasterization + GPU compositing &mdash; hit testing</div>
    <iframe src="hybrid.html"></iframe>
  </div>
  <div class="panel">
    <div class="label">CPU triangulation + GPU rasterization &mdash; hit testing</div>
    <iframe src="gpu.html"></iframe>
  </div>
</body>
